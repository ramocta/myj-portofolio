name: my_portofolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management & Routing ---
  get: ^4.6.6
  # go_router: ^13.2.0  # Hapus atau nonaktifkan ini jika Anda memakai routing bawaan GetX

  # --- Networking & API ---
  dio: ^5.4.1

  # --- Local Storage ---
  shared_preferences: ^2.2.2

  # --- Media & Image Handling ---
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # --- Assets Configuration ---
  assets:
    - assets/image/